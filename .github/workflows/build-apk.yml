name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Зависимости
        run: npm install

      - name: Шрифты и three.js в www
        run: npm run prepare-www

      - name: Android-проект
        run: npx cap add android

      - name: Только вертикальный режим
        run: sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml

      - name: Максимальная частота кадров
        run: |
          mkdir -p android/app/src/main/java/com/maks3592/sprint
          cat > android/app/src/main/java/com/maks3592/sprint/MainActivity.java <<'EOF'
          package com.maks3592.sprint;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.Display;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= 23) {
                      Display display = getWindowManager().getDefaultDisplay();
                      Display.Mode best = null;
                      for (Display.Mode mode : display.getSupportedModes()) {
                          if (best == null || mode.getRefreshRate() > best.getRefreshRate()) {
                              best = mode;
                          }
                      }
                      if (best != null) {
                          WindowManager.LayoutParams params = getWindow().getAttributes();
                          params.preferredDisplayModeId = best.getModeId();
                          getWindow().setAttributes(params);
                      }
                  }
              }
          }
          EOF

      - name: Синхронизация
        run: npx cap sync android

      - name: Сборка
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sprint-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Релиз с APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Sprint.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Sprint.apk --title "Спринт" --notes "Свежая сборка из ветки main." --latest

  site:
    needs: apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sprint-apk
          path: apk-in

      - name: Сборка сайта
        run: |
          mkdir -p _site/apk
          cp -r index.html site docs _site/
          cp apk-in/app-debug.apk _site/apk/Sprint.apk
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
