name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Зависимости
        run: npm install

      - name: Шрифты и three.js в www
        run: npm run prepare-www

      - name: Android-проект
        run: npx cap add android

      - name: Только вертикальный режим
        run: sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml

      - name: Синхронизация
        run: npx cap sync android

      - name: Сборка
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sprint-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
